name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TODO (Week 2): add a job that retrains the model on new/updated data,
# e.g. triggered on a schedule or on changes to data/.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
